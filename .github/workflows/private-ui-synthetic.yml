name: Sintonia private UI synthetic checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'test-private-ui-mocked.py'
      - 'check-private-ui.py'
      - 'requirements-ui-test.txt'
      - '.github/workflows/private-ui-synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sintonia-private-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mocked-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ui-test.txt
      - name: Install the pinned synthetic JS runtime
        run: python -m pip install -r requirements-ui-test.txt
      - name: Run mocked JavaScript regression suite
        run: python test-private-ui-mocked.py
      - name: Run static UI safety checks
        run: python check-private-ui.py
      - name: Check test helper syntax
        run: python -m py_compile test-private-ui-mocked.py check-private-ui.py
